<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
<title>Phase 2 clothing shop wireframes</title><desc>Four schematic screen layouts for catalog, customer checkout, admin management and mobile catalog.</desc>
<style>text{font:18px Arial;fill:#202833}.title{font-size:26px;font-weight:bold}.small{font-size:15px}rect{fill:#fff;stroke:#8190a0;stroke-width:2}.shade{fill:#eef2f6}.button{fill:#dbe8f5}</style>
<rect width="1440" height="1120" class="shade"/><text x="30" y="42" class="title">Clothing Shop — Phase 2 Wireframes</text><text x="30" y="70" class="small">Design diagrams • not screenshots • responsive regions and actions</text>
<g transform="translate(30,100)"><rect width="840" height="445"/><text x="20" y="32" class="title">Public catalog — desktop</text><rect x="20" y="50" width="800" height="45" class="shade"/><text x="35" y="79">Logo | Home | Products | Contact     Search     Account / Cart</text>
<rect x="20" y="115" width="215" height="310" class="shade"/><text x="35" y="145">Filters</text><text x="35" y="180">Category / Brand</text><text x="35" y="215">Size / Colour</text><text x="35" y="250">Min / Max base price</text><text x="35" y="285">In stock</text><text x="35" y="325">Clear filters</text>
<rect x="255" y="115" width="565" height="40"/><text x="275" y="141">Product count                          Sort</text>
<rect x="255" y="175" width="170" height="185"/><rect x="450" y="175" width="170" height="185"/><rect x="645" y="175" width="175" height="185"/>
<text x="272" y="225">Product image</text><text x="272" y="275">Name / Price</text><text x="272" y="320">View details</text><text x="466" y="225">Product image</text><text x="466" y="275">Name / Price</text><text x="466" y="320">View details</text><text x="660" y="225">Product image</text><text x="660" y="275">Name / Price</text><text x="660" y="320">View details</text>
<text x="375" y="405">Previous     Page number     Next</text></g>
<g transform="translate(900,100)"><rect width="510" height="980"/><text x="20" y="32" class="title">Mobile catalog</text><rect x="60" y="55" width="390" height="885" rx="20"/><rect x="80" y="85" width="350" height="150" class="shade"/><text x="100" y="115">Logo / navigation</text><text x="100" y="153">Search</text><text x="100" y="195">Wishlist / Cart / Account</text><text x="90" y="275">Collection title</text><rect x="80" y="295" width="350" height="240" class="shade"/><text x="100" y="325">Filters stack above results</text><text x="100" y="365">Category / Brand / Size</text><text x="100" y="405">Colour / price interval</text><text x="100" y="445">Stock / clear</text><text x="100" y="495">Sort products</text><rect x="80" y="555" width="350" height="235"/><text x="110" y="630">Readable full-width product card</text><text x="110" y="700">Image / Name / Price / Link</text><text x="110" y="840">Pagination / footer</text><text x="75" y="970" class="small">Navigation scrolls; no page overflow</text></g>
<g transform="translate(30,570)"><rect width="400" height="510"/><text x="18" y="32" class="title">Customer checkout</text><rect x="20" y="55" width="360" height="55" class="shade"/><text x="32" y="90">Account navigation</text><rect x="20" y="130" width="360" height="80"/><text x="32" y="163">Selected items / variants</text><text x="32" y="191">Quantity / current price</text><rect x="20" y="230" width="360" height="90"/><text x="32" y="264">Saved address selector</text><text x="32" y="294">Coupon code</text><rect x="20" y="340" width="360" height="65" class="shade"/><text x="32" y="367">Subtotal / discount / shipping</text><text x="32" y="393">Total — Cash on Delivery</text><rect x="20" y="425" width="360" height="45" class="button"/><text x="55" y="455">Review → Place order</text><text x="20" y="496" class="small">Validation / stock errors retain input</text></g>
<g transform="translate(455,570)"><rect width="415" height="510"/><text x="18" y="32" class="title">Admin / employee</text><rect x="20" y="55" width="105" height="425" class="shade"/><text x="30" y="92" class="small">Dashboard</text><text x="30" y="132" class="small">Products*</text><text x="30" y="172" class="small">Orders</text><text x="30" y="212" class="small">Inventory</text><text x="30" y="252" class="small">Reports*</text><text x="30" y="292" class="small">Alerts</text><text x="30" y="332" class="small">Support</text><text x="30" y="438" class="small">*Admin only</text><rect x="145" y="55" width="250" height="85"/><text x="162" y="90">Role-specific KPIs</text><text x="162" y="120" class="small">Real API statistics</text><rect x="145" y="160" width="250" height="55"/><text x="161" y="194">Search / filter</text><rect x="145" y="235" width="250" height="135"/><text x="163" y="275">Data table</text><text x="163" y="310">Status / actions</text><text x="163" y="343" class="small">Pagination / empty state</text><rect x="145" y="390" width="250" height="90" class="button"/><text x="161" y="425">Edit / confirm operation</text><text x="161" y="456" class="small">Busy / error / success</text></g></svg>
