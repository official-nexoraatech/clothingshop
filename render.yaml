
services:
  - type: web
    name: clothing-shop-fullstack
    runtime: node
    plan: free

    buildCommand: npm install && npm run build
    startCommand: npm run server

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: AUTH_RATE_LIMIT
        value: "20"

      - key: PHASE9_RATE_LIMIT
        value: "30"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
