services:
  - type: web
    name: clothing-shop-frontend
    runtime: static
    branch: feature/chaitanya-clothing
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://clothingshop-fafa.onrender.com/api
      - key: NODE_VERSION
        value: 22.14.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
